[package]
name = "tygr-derive"
version = "0.6.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Derive macros for tygr — do not depend on this directly."
repository = "https://github.com/intersystems-community/tygr"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
