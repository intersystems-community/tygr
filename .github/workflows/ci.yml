name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - ".github/**"
      - "!.github/workflows/**"
  pull_request:
    branches: [master]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  version-consistency:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: tygr and tygr-derive versions, and their Cargo.lock entries, line up
        run: |
          set -e
          tygr_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          derive_version="$(grep -m1 '^version' tygr-derive/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if [ "$tygr_version" != "$derive_version" ]; then
            echo "tygr ($tygr_version) and tygr-derive ($derive_version) versions are out of lockstep"
            exit 1
          fi
          check_lock_entry() {
            local lock="$1" name="$2" expected="$3"
            local actual
            actual="$(grep -A1 "name = \"$name\"\$" "$lock" | grep '^version' | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')"
            if [ "$actual" != "$expected" ]; then
              echo "$lock's \"$name\" entry ($actual) doesn't match $name's Cargo.toml ($expected)"
              exit 1
            fi
          }
          check_lock_entry Cargo.lock tygr "$tygr_version"
          check_lock_entry Cargo.lock tygr-derive "$derive_version"

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --lib --bins --examples --tests

      - name: Doc tests
        run: cargo test --doc

      - name: Docs
        run: cargo doc --no-deps

  minimum-supported-rust-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2

      - name: Build on the rust-version (1.88)
        env:
          # Outranks rust-toolchain.toml, which pins stable.
          RUSTUP_TOOLCHAIN: "1.88"
        # Building, not checking, also runs post-monomorphization checks.
        run: cargo test --no-run --all-targets
