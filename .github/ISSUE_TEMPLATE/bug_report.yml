name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal grammar / input that triggers the problem. Code snippets help most.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tygr version
      description: Crate version or git commit.
    validations:
      required: true
