name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: tygr version
      description: Crate version or git commit.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal grammar / input that triggers the problem. Code snippets help most.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What do you expect?
    validations:
      required: false
