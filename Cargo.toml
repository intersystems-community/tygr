[package]
name = "tygr"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Define your grammar once as Rust types and get a parser, printer, and EBNF presentation for free."
repository = "https://github.com/intersystems-community/tygr"
readme = "README.md"

[dependencies]
either = "1.15.0"
tygr-derive = { path = "tygr-derive", version = "0.1" }

[features]
default = ["trace"]
trace = ["trace_pos", "trace_attempts", "tygr-derive/trace"]
trace_pos = ["trace_any", "tygr-derive/trace_pos"]
trace_attempts = ["trace_pos", "context"]
trace_any = ["history"]
history = []
context = []

[[bench]]
name = "json_optimized"
harness = false

[lints.clippy]
# Grammars are written as nested generic types by design; complexity here
# isn't a code smell.
type_complexity = "allow"
