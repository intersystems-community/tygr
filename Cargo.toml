[package]
name = "tygr"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Define your grammar once as Rust types and get a parser, printer, and EBNF presentation for free."
repository = "https://github.com/intersystems-community/tygr"
readme = "README.md"

[workspace]

[dependencies]
either = "1.15.0"
tygr-derive = { path = "tygr-derive", version = "=0.7.0" }

[[bench]]
name = "json"
harness = false

[lints.clippy]
# Grammars are written as nested generic types by design; complexity here
# isn't a code smell.
type_complexity = "allow"
